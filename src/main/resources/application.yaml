spring:
  application:
    name: tinyurl
  profiles:
    active: local
  config:
    import:
      - optional:${spring.profiles.active}/db.yaml
      - optional:${spring.profiles.active}/cache.yaml
      - optional:${spring.profiles.active}/zookeeper.yaml
      - optional:${spring.profiles.active}/click-event.yaml
      - optional:${spring.profiles.active}/storage.yaml
      - optional:${spring.profiles.active}/cleanup.yaml
      - optional:${spring.profiles.active}/rate-limit.yaml
      - optional:${spring.profiles.active}/management.yaml
      - optional:${spring.profiles.active}/app.yaml
  modulith:
    republish-outstanding-events-on-restart: true

# 신뢰 가능한 프록시 대역에서 온 요청만 X-Forwarded-For를 getRemoteAddr()에 반영한다 - common.web.util.ClientIpResolver 참고.
server:
  forward-headers-strategy: native

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      lifecycle-management: start-only

---
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
