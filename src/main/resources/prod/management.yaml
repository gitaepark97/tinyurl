management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  observations:
    annotations:
      enabled: true
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT}
    metrics:
      export:
        url: ${OTLP_METRICS_ENDPOINT}
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGGING_ENDPOINT}
